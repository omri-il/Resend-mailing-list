<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לייב חינמי | עוזר אישי למורים</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF;
            --text: #111827;
            --primary: #2563EB;
            --surface: #F3F4F6;
        }

        body {
            margin: 0;
            font-family: 'Heebo', sans-serif;
            background: var(--surface);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .squeeze-container {
            background: var(--bg);
            border-radius: 32px;
            padding: 60px 48px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #DBEAFE;
            color: #1E40AF;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.1rem;
            color: #4B5563;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: right;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .cta-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .cta-btn:hover {
            background: #1D4ED8;
        }

        .micro-copy {
            font-size: 0.8rem;
            color: #9CA3AF;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="squeeze-container">
        <div class="badge">🔴 הדרכת לייב חינמית למורים</div>
        <h1>ה"צ'יט-קוד" שיכין לכם את השבוע מראש</h1>
        <p>איך לבנות "עוזר AI אישי" (Gem) שיכתוב מערכי שיעור ויבדוק מבחנים, בלי לדעת לכתוב פראומפטים מסובכים.</p>

        <form>
            <div class="input-group">
                <label>לאן לשלוח את הלינק לשידור?</label>
                <input type="email" placeholder="הכנס אימייל כאן..." required>
            </div>
            <button type="button" class="cta-btn">שלח לי את הקישור ללייב</button>
            <div class="micro-copy">100% חינם. נשלח לינק לזום + סיכום.</div>
        </form>
    </div>
</body>

</html>
